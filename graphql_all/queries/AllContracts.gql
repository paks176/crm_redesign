query allContracts ($page: Int, $perPage: Int, $sortField: String, $sortOrder: String, $filter: ContractFilter) {
  allContracts (page: $page, perPage: $perPage, sortField: $sortField, sortOrder: $sortOrder, filter: $filter) {
    id
    name
    date
    status
    debt
    summ
    manager {
      name
    }
    partner {
      name
      id
    }
    duration
    payments_remainder
    payments {
      date
      plan
      paid
    }
    balanceholder
    property_vin
    property_name
    property_sign
    contract_id
    date_payment
  }
  _allContractsMeta (filter: $filter) {
    count
  }
}
