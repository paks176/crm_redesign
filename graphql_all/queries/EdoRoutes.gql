query EdoRoutes {
  edoRoutes {
    id
    creator {
      id
      name
    }
    responsible {
      id
      name
    }
    contract {
      id
      name
      partner {
        id
        inn
      }
    }
    hidden
    waypoints {
      id
      route {
        id
        contract {
          id
        }
      }
      to_name
      to_inn
      to_kpp
      from_name
      from_inn
      documents {
        id
        document_id
        document_view
        message_id
        entity_id
        status
        filename
        fileext
        hidden
        createdAt
        updatedAt
      }
      operator
      status
      pack
      hidden
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}