query managerSupportRequests {
  managerSupportRequests {
    id
    client_id
    client_name
    company_id
    company_name
    role
    responsible_ids
    created_date
    updated_date
    last_date
		theme {
      id
      name
      priority
    }
    status
    questions {
      id
      support_request {
        id
      }
      question
      question_files
      created_date
      updated_date
      answer
      answer_files
    }
  }
}